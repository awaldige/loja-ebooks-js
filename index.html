<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de eBooks</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="motion">
    <h1>📚 Loja de eBooks</h1>
    <p>Projeto demonstrativo para portfólio</p>
</header>

<section id="carrinho-info">
    <div class="carrinho-container">
        <span>Itens: <strong id="qtd-itens">0</strong></span>
        <span>Total: <strong id="valor-total">R$ 0,00</strong></span>
        <button onclick="abrirModal()">Ver Carrinho</button>
    </div>
</section>

<main class="catalogo"></main>

<div class="paginacao" id="paginacao"></div>

<div id="modal" class="modal">
    <div class="modal-conteudo">
        <h2>🛒 Carrinho</h2>
        <ul id="lista-produtos"></ul>
        <p class="total">Total: <strong id="total-modal"></strong></p>

        <button onclick="pagarPix()">Pix</button>
        <button onclick="pagarMP()">Mercado Pago</button>
        <button class="cancelar" onclick="fecharModal()">Fechar</button>
    </div>
</div>

<div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Processando pagamento...</p>
</div>

<div id="toast" class="toast"></div>

<footer class="motion">
    <p>© 2026 - Projeto demonstrativo</p>
</footer>

<script src="script.js"></script>
</body>
</html>
